  <script>
    'use strict';

    /**
     * =========================================================================
     * 1. UTILITIES & FORMATTERS (Utils)
     * =========================================================================
     */
    const Utils = {
      generateId(prefix = 'ID') {
        const ts = Date.now().toString(36).toUpperCase();
        const rand = Math.random().toString(36).substring(2, 6).toUpperCase();
        return `${prefix}-${ts}-${rand}`;
      },

      escapeHTML(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      },

      formatCurrency(amount, currencySymbol = null) {
        const symbol = currencySymbol || StorageService.getSettings().currency || 'EGP';
        const num = Number(amount) || 0;
        return `${symbol} ${num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
      },

      formatDate(isoString, includeTime = true) {
        if (!isoString) return '—';
        const d = new Date(isoString);
        if (isNaN(d.getTime())) return isoString;
        const opts = { year: 'numeric', month: 'short', day: '2-digit' };
        if (includeTime) {
          opts.hour = '2-digit';
          opts.minute = '2-digit';
        }
        return d.toLocaleDateString('en-US', opts);
      },

      todayISO() {
        return new Date().toISOString().split('T')[0];
      },

      daysUntil(dateStr) {
        if (!dateStr) return 9999;
        const target = new Date(dateStr);
        const now = new Date();
        now.setHours(0, 0, 0, 0);
        return Math.ceil((target - now) / (1000 * 60 * 60 * 24));
      },

      showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const colors = {
          success: 'bg-navy-800 border-medteal-500 text-white',
          error: 'bg-red-900 border-red-400 text-white',
          warning: 'bg-amber-900 border-amber-400 text-white',
          info: 'bg-navy-800 border-medblue-500 text-white',
        };
        const icons = {
          success: 'check-circle-2',
          error: 'alert-circle',
          warning: 'alert-triangle',
          info: 'info',
        };
        const toast = document.createElement('div');
        toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl border-l-4 shadow-elevated text-sm font-medium transition-all duration-300 ${colors[type] || colors.info}`;
        toast.innerHTML = `
          <i data-lucide="${icons[type] || 'info'}" class="w-5 h-5 shrink-0"></i>
          <span class="flex-1">${this.escapeHTML(message)}</span>
        `;
        container.appendChild(toast);
        if (window.lucide) lucide.createIcons({ nodes: [toast] });
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(8px)';
          setTimeout(() => toast.remove(), 300);
        }, 3200);
      },

      playBeep(freq = 880, duration = 0.08) {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + duration);
        } catch (e) {
          // AudioContext may require user interaction first
        }
      },

      getMedicalThumbnailSVG(iconType = 'device', accent = '#1D63B8') {
        const icons = {
          monitor: `<rect x="14" y="14" width="36" height="28" rx="4" fill="${accent}" opacity="0.15" stroke="${accent}" stroke-width="2.5"/><path d="M20 28h5l3-6 4 12 3-6h7" stroke="${accent}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M24 48h16M32 42v6" stroke="${accent}" stroke-width="2.5" stroke-linecap="round"/>`,

          syringe: `<path d="M42 14l8 8M46 18l-6 6M22 34l14-14 8 8-14 14-8-8zM14 50l8-8M27 29l4 4M31 25l4 4" stroke="#0D9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#0D9488" fill-opacity="0.12"/>`,
          kit: `<rect x="14" y="20" width="36" height="28" rx="5" fill="#DC2626" opacity="0.12" stroke="#DC2626" stroke-width="2.5"/><path d="M26 20v-4a2 2 0 012-2h8a2 2 0 012 2v4M32 28v12M26 34h12" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round"/>`,

        };
        return `<svg viewBox="0 0 64 64" class="w-full h-full" xmlns="http://www.w3.org/2000/svg">${icons[iconType] || icons.default}</svg>`;
      }

        RETURNS: 'medical_pos_returns',
        SETTINGS: 'medical_pos_settings',
        VERSION: 'medical_pos_schema_version',
      },
      SCHEMA_VERSION: '1.0.0',

      read(key, fallback = []) {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) return fallback;
          return JSON.parse(raw);
        } catch (err) {
          console.error(`Storage read error [${key}]:`, err);
          return fallback;
        }
      },

      write(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
          return true;
        } catch (err) {
          console.error(`Storage write error [${key}]:`, err);
          Utils.showToast('Storage quota exceeded or unavailable.', 'error');
          return false;
        }
      },

    const ValidationService = {
      validateProduct(data, editingId = null) {
        const errors = [];
        if (!data.name || !data.name.trim()) errors.push('Product Name is required.');
        if (!data.sku || !data.sku.trim()) errors.push('SKU is required.');
        if (!data.barcode || !data.barcode.trim()) errors.push('Barcode is required.');
        if (Number(data.purchasePrice) < 0) errors.push('Purchase Price cannot be negative.');
        if (Number(data.sellingPrice) <= 0) errors.push('Selling Price must be greater than zero.');
        if (Number(data.quantity) < 0) errors.push('Quantity cannot be negative.');
        if (Number(data.minStock) < 0) errors.push('Minimum Stock cannot be negative.');

        const products = StorageService.getProducts();
        const dupSku = products.find(
          (p) => p.sku.trim().toLowerCase() === data.sku.trim().toLowerCase() && p.id !== editingId
        );
        if (dupSku) errors.push(`Duplicate SKU "${data.sku}" already exists on ${dupSku.name}.`);

        const dupBarcode = products.find(
          (p) => p.barcode.trim().toLowerCase() === data.barcode.trim().toLowerCase() && p.id !== editingId
        );
        if (dupBarcode) errors.push(`Duplicate Barcode "${data.barcode}" already exists on ${dupBarcode.name}.`);

        return { valid: errors.length === 0, errors };
      },

      validateCustomer(data) {
        const errors = [];
        if (!data.fullName || !data.fullName.trim()) errors.push('Customer Full Name is required.');
        if (!data.phone || !data.phone.trim()) errors.push('Phone number is required.');
        return { valid: errors.length === 0, errors };
      },

      validateCartForCheckout(cartItems, paidAmount, grandTotal) {
        const errors = [];
        if (!cartItems || cartItems.length === 0) {
          errors.push('Shopping cart is empty.');
          return { valid: false, errors };
        }
        const liveProducts = StorageService.getProducts();
        for (const item of cartItems) {
          if (item.quantity <= 0) {
            errors.push(`Invalid quantity for ${item.name}.`);
          }
          const prod = liveProducts.find((p) => p.id === item.productId);
          if (!prod) {
            errors.push(`Product "${item.name}" no longer exists in catalog.`);
          } else if (prod.quantity < item.quantity) {
            errors.push(`Insufficient stock for "${prod.name}". Available: ${prod.quantity}, Requested: ${item.quantity}.`);
          }
        }
        if (Number(paidAmount) < 0) {
          errors.push('Paid amount cannot be negative.');
        }
        return { valid: errors.length === 0, errors };
      }
    };

    // --- INVENTORY MODULE ---
    const InventoryModule = {
      recordMovement({ productId, productName, sku, batchNumber = 'GENERAL', previousQty, newQty, type, reason }) {
        const movements = StorageService.getInventoryMovements();
        const entry = {
          id: Utils.generateId('MOV'),
          productId,
          productName,
          sku,
          batchNumber,
          previousQty: Number(previousQty),
          newQty: Number(newQty),
          delta: Number(newQty) - Number(previousQty),
          type, // STOCK_IN, STOCK_OUT, ADJUSTMENT, SALE_OUT, SALE_CANCEL_RESTORE, RETURN_RESTOCK
          reason: reason || type,
          date: new Date().toISOString(),
        };
        movements.unshift(entry);
        StorageService.saveInventoryMovements(movements);
        return entry;
      },

      // Deduct stock using FEFO (First-Expired, First-Out) across batches
      deductStockFEFO(productId, qtyToDeduct, reason) {
        const products = StorageService.getProducts();
        const idx = products.findIndex((p) => p.id === productId);
        if (idx === -1) throw new Error('Product not found for deduction.');
        const prod = products[idx];
        if (prod.quantity < qtyToDeduct) {
          throw new Error(`Insufficient stock for ${prod.name}`);
        }

        const prevQty = prod.quantity;
        let remaining = qtyToDeduct;
        let usedBatches = [];

        if (Array.isArray(prod.batches) && prod.batches.length > 0) {
          // Sort earliest expiry first
          prod.batches.sort((a, b) => new Date(a.expiryDate || '2099-12-31') - new Date(b.expiryDate || '2099-12-31'));
          for (const batch of prod.batches) {
            if (remaining <= 0) break;
            if (batch.quantity > 0) {
              const take = Math.min(batch.quantity, remaining);
              batch.quantity -= take;
              remaining -= take;
              usedBatches.push(`${batch.batchNumber}(-${take})`);
            }
          }
          // Remove depleted batches and update earliest active expiryDate
          prod.batches = prod.batches.filter((b) => b.quantity > 0);
          if (prod.batches.length > 0) {
            prod.expiryDate = prod.batches[0].expiryDate;
          }
        }

        prod.quantity = Math.max(0, prevQty - qtyToDeduct);
        products[idx] = prod;
        StorageService.saveProducts(products);

        this.recordMovement({
          productId: prod.id,
          productName: prod.name,
          sku: prod.sku,
          batchNumber: usedBatches.join(', ') || 'GENERAL',
          previousQty: prevQty,
          newQty: prod.quantity,
          type: 'SALE_OUT',
          reason,
        });
      },

      addStock({ productId, quantity, batchNumber, expiryDate, reason, type = 'STOCK_IN' }) {
        const qty = Number(quantity);
        if (qty <= 0) throw new Error('Quantity must be greater than 0.');
        const products = StorageService.getProducts();
        const idx = products.findIndex((p) => p.id === productId);
        if (idx === -1) throw new Error('Product not found.');

        const prod = products[idx];
        const prevQty = prod.quantity;
        prod.quantity = prevQty + qty;

        if (!Array.isArray(prod.batches)) prod.batches = [];
        const cleanBatch = (batchNumber || `BCH-${Date.now().toString().slice(-4)}`).trim();
        const exp = expiryDate || prod.expiryDate || '';

        const existingBatch = prod.batches.find((b) => b.batchNumber === cleanBatch && b.expiryDate === exp);
        if (existingBatch) {
          existingBatch.quantity += qty;
        } else {
          prod.batches.push({ batchNumber: cleanBatch, quantity: qty, expiryDate: exp });
        }

        // Keep batches sorted by earliest expiry
        prod.batches.sort((a, b) => new Date(a.expiryDate || '2099-12-31') - new Date(b.expiryDate || '2099-12-31'));
        if (prod.batches[0]?.expiryDate) {
          prod.expiryDate = prod.batches[0].expiryDate;
        }

        products[idx] = prod;
        StorageService.saveProducts(products);

        this.recordMovement({
          productId: prod.id,
          productName: prod.name,
          sku: prod.sku,
          batchNumber: cleanBatch,
          previousQty: prevQty,
          newQty: prod.quantity,
          type,
          reason: reason || 'Stock replenishment',
        });
        AppRouter.updateNavBadges();
      },

      removeOrAdjustStock({ productId, newQuantity, deltaQuantity, mode, reason }) {
        const products = StorageService.getProducts();
        const idx = products.findIndex((p) => p.id === productId);
        if (idx === -1) throw new Error('Product not found.');
        const prod = products[idx];
        const prevQty = prod.quantity;
        let targetQty = prevQty;

        if (mode === 'STOCK_OUT') {
          const out = Number(deltaQuantity);
          if (out <= 0) throw new Error('Stock out quantity must be greater than 0.');
          if (out > prevQty) throw new Error(`Cannot remove ${out} units. Only ${prevQty} available.`);
          targetQty = prevQty - out;
        } else {
          targetQty = Number(newQuantity);
          if (targetQty < 0) throw new Error('Adjusted stock cannot be negative.');
        }

        const diff = targetQty - prevQty;
        if (diff === 0) throw new Error('No quantity change detected.');

        // Sync batches proportionally or on earliest batch
        if (diff < 0 && Array.isArray(prod.batches) && prod.batches.length > 0) {
          let toDeduct = Math.abs(diff);
          for (const b of prod.batches) {
            if (toDeduct <= 0) break;
            const take = Math.min(b.quantity, toDeduct);
            b.quantity -= take;
            toDeduct -= take;
          }
          prod.batches = prod.batches.filter((b) => b.quantity > 0);
        } else if (diff > 0) {
          if (!Array.isArray(prod.batches)) prod.batches = [];
          prod.batches.push({
            batchNumber: `ADJ-${Date.now().toString().slice(-4)}`,
            quantity: diff,
            expiryDate: prod.expiryDate || '',
          });
        }

        prod.quantity = targetQty;
        products[idx] = prod;
        StorageService.saveProducts(products);

        this.recordMovement({
          productId: prod.id,
          productName: prod.name,
          sku: prod.sku,
          batchNumber: 'ADJUSTMENT',
          previousQty: prevQty,
          newQty: targetQty,
          type: mode === 'STOCK_OUT' ? 'STOCK_OUT' : 'ADJUSTMENT',
          reason: reason || (mode === 'STOCK_OUT' ? 'Manual Stock Out' : 'Inventory Audit Adjustment'),
        });
        AppRouter.updateNavBadges();
      }
    };

    // --- CART MODULE ---
    const CartModule = {
      items: [], // { productId, name, sku, unitPrice, purchasePrice, quantity, maxStock }
      customerId: 'CUST-WALKIN',
      discountType: 'fixed', // 'fixed' | 'percent'
      discountValue: 0,

      paidAmount: '',
      paidManuallyEdited: false,

      init() {
        const settings = StorageService.getSettings();

      addItem(productId, qty = 1) {
        const products = StorageService.getProducts();
        const product = products.find((p) => p.id === productId);
        if (!product) {
          Utils.showToast('Product not found.', 'error');
          return false;
        }
        if (product.quantity <= 0) {
          Utils.showToast(`"${product.name}" is Out of Stock!`, 'error');
          Utils.playBeep(240, 0.15);
          return false;
        }

        const existing = this.items.find((i) => i.productId === productId);
        if (existing) {
          if (existing.quantity + qty > product.quantity) {
            Utils.showToast(`Max available stock (${product.quantity}) reached for ${product.name}.`, 'warning');
            Utils.playBeep(300, 0.12);
            return false;
          }
          existing.quantity += qty;
          existing.maxStock = product.quantity;
        } else {
          if (qty > product.quantity) {
            Utils.showToast(`Only ${product.quantity} units available.`, 'warning');
            return false;
          }
          this.items.push({
            productId: product.id,
            name: product.name,
            sku: product.sku,
            unitPrice: Number(product.sellingPrice),
            purchasePrice: Number(product.purchasePrice),
            quantity: qty,
            maxStock: product.quantity,
          });
        }
        Utils.playBeep(920, 0.06);
        POSModule.renderCart();
        return true;
      },

      updateQuantity(productId, newQty) {
        const idx = this.items.findIndex((i) => i.productId === productId);
        if (idx === -1) return;
        const products = StorageService.getProducts();
        const prod = products.find((p) => p.id === productId);
        const liveStock = prod ? prod.quantity : this.items[idx].maxStock;

        if (newQty <= 0) {
          this.removeItem(productId);
          return;
        }
        if (newQty > liveStock) {
          Utils.showToast(`Cannot exceed available stock (${liveStock}).`, 'warning');
          this.items[idx].quantity = liveStock;
        } else {
          this.items[idx].quantity = newQty;
        }
        this.items[idx].maxStock = liveStock;
        POSModule.renderCart();
      },

      removeItem(productId) {
        this.items = this.items.filter((i) => i.productId !== productId);
        POSModule.renderCart();
      },

      clear() {
        this.items = [];
        this.discountValue = 0;
        this.shippingCost = Number(StorageService.getSettings().defaultShipping) || 0;
        this.paidAmount = '';
        this.paidManuallyEdited = false;
        POSModule.renderCart();
      },

      getTotals() {
        const subtotal = this.items.reduce((sum, item) => sum + item.unitPrice * item.quantity, 0);
        let discountAmount = 0;
        const rawDisc = Math.max(0, Number(this.discountValue) || 0);
        if (this.discountType === 'percent') {
          discountAmount = Math.min(subtotal, (subtotal * Math.min(100, rawDisc)) / 100);
        } else {
          discountAmount = Math.min(subtotal, rawDisc);
        }
        const shipping = Math.max(0, Number(this.shippingCost) || 0);
        const grandTotal = Math.max(0, subtotal - discountAmount + shipping);

        const effectivePaid = this.paidManuallyEdited
          ? Math.max(0, Number(this.paidAmount) || 0)
          : grandTotal;

        const remainingBalance = Math.max(0, grandTotal - effectivePaid);
        const changeDue = Math.max(0, effectivePaid - grandTotal);

        return {
          subtotal,
          discountAmount,
          shipping,
          grandTotal,
          effectivePaid,
          remainingBalance,
          changeDue,
        };
      }
    };

    // --- CHECKOUT MODULE (Atomic Transaction Flow) ---
    const CheckoutModule = {
      completeSale() {
        const totals = CartModule.getTotals();
        const validation = ValidationService.validateCartForCheckout(
          CartModule.items,
          totals.effectivePaid,
          totals.grandTotal
        );

        if (!validation.valid) {
          Utils.showToast(validation.errors[0], 'error');
          return null;
        }

        const customers = StorageService.getCustomers();
        const customer = customers.find((c) => c.id === CartModule.customerId) || {
          id: 'CUST-WALKIN',
          fullName: 'Walk-in Customer',
          phone: '0000000000',
        };

        // 1. Build immutable Sale record with product snapshots
        const saleRecord = {
          id: Utils.generateId('SAL'),
          customerId: customer.id,
          customerName: customer.fullName,
          customerPhone: customer.phone,
          items: CartModule.items.map((item) => ({
            productId: item.productId,
            name: item.name,
            sku: item.sku,
            quantity: item.quantity,
            unitPrice: item.unitPrice,
            purchasePrice: item.purchasePrice,
            subtotal: item.unitPrice * item.quantity,
          })),
          subtotal: totals.subtotal,
          discount: totals.discountAmount,
          shipping: totals.shipping,
          grandTotal: totals.grandTotal,
          paymentMethod: CartModule.paymentMethod,
          paidAmount: totals.effectivePaid,
          remainingBalance: totals.remainingBalance,
          changeDue: totals.changeDue,
          status: 'Completed',
          stockDeducted: true,
          returnedItems: [],
          createdAt: new Date().toISOString(),
        };

        try {
          // 2. Save Sale first
          const sales = StorageService.getSales();
          sales.unshift(saleRecord);
          StorageService.saveSales(sales);

          // 3. Deduct stock & record Stock Movements exactly once per item
          for (const item of saleRecord.items) {
            InventoryModule.deductStockFEFO(
              item.productId,
              item.quantity,
              `Sale ${saleRecord.id} (${customer.fullName})`
            );
          }

          // 4. Update Customer Metrics & Outstanding Balance
          const custIdx = customers.findIndex((c) => c.id === customer.id);
          if (custIdx !== -1) {
            customers[custIdx].totalOrders = (Number(customers[custIdx].totalOrders) || 0) + 1;
            customers[custIdx].totalSpending = (Number(customers[custIdx].totalSpending) || 0) + saleRecord.grandTotal;
            customers[custIdx].outstandingBalance =
              (Number(customers[custIdx].outstandingBalance) || 0) + saleRecord.remainingBalance;
            StorageService.saveCustomers(customers);
          }

          // 5. Reset Cart, Refresh POS Grid & Badges, Open Receipt Modal
          CartModule.clear();
          AppRouter.updateNavBadges();
          if (AppRouter.currentRoute === 'pos') {
            POSModule.renderProductGrid();
          }
          Utils.playBeep(1100, 0.12);
          Utils.showToast(`Sale ${saleRecord.id} completed successfully!`, 'success');
          ReceiptModule.openReceiptModal(saleRecord.id);
          return saleRecord;
        } catch (err) {
          console.error('Checkout transaction failed:', err);
          Utils.showToast(`Checkout failed: ${err.message}`, 'error');
          return null;
        }
      }
    };

      cancelSale(saleId) {
        const sales = StorageService.getSales();
        const idx = sales.findIndex((s) => s.id === saleId);
        if (idx === -1) return;
        const sale = sales[idx];

        if (sale.status === 'Cancelled') {
          Utils.showToast('This sale is already cancelled.', 'warning');
          return;
        }

        // Restore stock ONLY if original sale deducted it and hasn't been restored
        if (sale.stockDeducted !== false && !sale.stockRestoredOnCancel) {
          for (const item of sale.items) {
            // Subtract any already returned quantities so we don't double-restore
            const alreadyReturned = (sale.returnedItems || [])
              .filter((r) => r.productId === item.productId)
              .reduce((sum, r) => sum + r.quantity, 0);
            const qtyToRestore = Math.max(0, item.quantity - alreadyReturned);

            if (qtyToRestore > 0) {
              const products = StorageService.getProducts();
              const prod = products.find((p) => p.id === item.productId);
              if (prod) {
                InventoryModule.addStock({
                  productId: prod.id,
                  quantity: qtyToRestore,
                  batchNumber: 'CANCEL-RESTORE',
                  expiryDate: prod.expiryDate,
                  reason: `Cancelled Sale ${sale.id}`,
                  type: 'SALE_CANCEL_RESTORE',
                });
              }
            }
          }
          sale.stockRestoredOnCancel = true;
        }

        // Revert customer totals safely
        const customers = StorageService.getCustomers();
        const cIdx = customers.findIndex((c) => c.id === sale.customerId);
        if (cIdx !== -1) {
          customers[cIdx].totalOrders = Math.max(0, (customers[cIdx].totalOrders || 1) - 1);
          customers[cIdx].totalSpending = Math.max(0, (customers[cIdx].totalSpending || 0) - sale.grandTotal);
          customers[cIdx].outstandingBalance = Math.max(
            0,
            (customers[cIdx].outstandingBalance || 0) - (sale.remainingBalance || 0)
          );
          StorageService.saveCustomers(customers);
        }

        sale.status = 'Cancelled';
        sale.cancelledAt = new Date().toISOString();
        sales[idx] = sale;
        StorageService.saveSales(sales);

        Utils.showToast(`Sale ${sale.id} cancelled and stock restored.`, 'success');
        AppRouter.closeModal();
        this.render();
      },

      processReturn(saleId, returnLines, reason) {
        const sales = StorageService.getSales();
        const sIdx = sales.findIndex((s) => s.id === saleId);
        if (sIdx === -1) throw new Error('Original sale not found.');
        const sale = sales[sIdx];

        if (sale.status === 'Cancelled') {
          throw new Error('Cannot process returns on a cancelled sale.');
        }

        const validLines = returnLines.filter((l) => l.returnQty > 0);
        if (validLines.length === 0) {
          throw new Error('Please enter at least 1 item quantity to return.');
        }

        let totalRefund = 0;
        const processedItems = [];

        for (const line of validLines) {
          const origItem = sale.items.find((i) => i.productId === line.productId);
          if (!origItem) throw new Error(`Item ${line.name} not part of original sale.`);

          const prevReturned = (sale.returnedItems || [])
            .filter((r) => r.productId === line.productId)
            .reduce((sum, r) => sum + r.quantity, 0);

          const maxReturnable = origItem.quantity - prevReturned;
          if (line.returnQty > maxReturnable) {
            throw new Error(`Cannot return ${line.returnQty} of ${origItem.name}. Max returnable: ${maxReturnable}.`);
          }

          const lineRefund = line.returnQty * origItem.unitPrice;
          totalRefund += lineRefund;

          processedItems.push({
            productId: origItem.productId,
            name: origItem.name,
            sku: origItem.sku,
            quantity: line.returnQty,
            unitPrice: origItem.unitPrice,
            refundAmount: lineRefund,
            restocked: Boolean(line.restock),
          });

          // Track returned quantity on sale to prevent duplicate returns
          if (!Array.isArray(sale.returnedItems)) sale.returnedItems = [];
          sale.returnedItems.push({
            productId: origItem.productId,
            quantity: line.returnQty,
            date: new Date().toISOString(),
          });

          // Restore stock ONLY if eligible for restocking
          if (line.restock) {
            const products = StorageService.getProducts();
            const prod = products.find((p) => p.id === origItem.productId);
            if (prod) {
              InventoryModule.addStock({
                productId: prod.id,
                quantity: line.returnQty,
                batchNumber: 'RETURN-RESTOCK',
                expiryDate: prod.expiryDate,
                reason: `Customer Return on ${sale.id}`,
                type: 'RETURN_RESTOCK',
              });
            }
          }
        }

        // Save separate Return Transaction record
        const returns = StorageService.getReturns();
        const returnRecord = {
          id: Utils.generateId('RET'),
          saleId: sale.id,
          customerId: sale.customerId,
          customerName: sale.customerName,
          items: processedItems,
          totalRefund,
          reason: reason || 'Customer return',
          createdAt: new Date().toISOString(),
        };
        returns.unshift(returnRecord);
        StorageService.saveReturns(returns);

        // Update Sale status (Partially Returned vs Returned)
        const totalSoldQty = sale.items.reduce((s, i) => s + i.quantity, 0);
        const totalReturnedQty = sale.returnedItems.reduce((s, r) => s + r.quantity, 0);
        sale.status = totalReturnedQty >= totalSoldQty ? 'Returned' : 'Partially Returned';
        sales[sIdx] = sale;
        StorageService.saveSales(sales);

        // Adjust customer spending
        const customers = StorageService.getCustomers();
        const cIdx = customers.findIndex((c) => c.id === sale.customerId);
        if (cIdx !== -1) {
          customers[cIdx].totalSpending = Math.max(0, (customers[cIdx].totalSpending || 0) - totalRefund);
          StorageService.saveCustomers(customers);
        }

        return returnRecord;
      },

        const sale = StorageService.getSales().find((s) => s.id === saleId);

                <td class="py-2.5 px-3 text-right tabular-nums text-sm">${Utils.formatCurrency(item.unitPrice)}</td>
                <td class="py-2.5 px-3 text-center">
                  <input type="number" min="0" max="${remainingQty}" value="0"
                    data-product-id="${item.productId}"
                    data-product-name="${Utils.escapeHTML(item.name)}"
                    class="return-qty-input w-20 px-2 py-1 text-center rounded-lg border border-slate-300 text-sm font-bold tabular-nums"
                    ${remainingQty === 0 ? 'disabled' : ''} />
                </td>
                <td class="py-2.5 px-3 text-center">
                  <input type="checkbox" checked data-restock-for="${item.productId}" class="w-4 h-4 accent-medteal-600 rounded" ${remainingQty === 0 ? 'disabled' : ''} />
                </td>
              </tr>

          })
          .join('');

        AppRouter.openModal(`
          <form id="process-return-form" class="p-6 space-y-4">
            <div class="flex items-start justify-between border-b border-slate-200 pb-3">
              <div>
                <h3 class="text-lg font-bold text-navy-800">Process Customer Return</h3>
                <p class="text-xs text-slate-500">Original Invoice: <strong>${Utils.escapeHTML(sale.id)}</strong> • ${Utils.escapeHTML(sale.customerName)}</p>
              </div>
              <button type="button" onclick="AppRouter.closeModal()" class="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500">

              </button>
            </div>

            <div class="border border-slate-200 rounded-xl overflow-hidden">
              <table class="w-full text-left">
                <thead class="bg-slate-50 text-[11px] uppercase text-slate-500 border-b border-slate-200">
                  <tr>
                    <th class="py-2 px-3">Item</th>
                    <th class="py-2 px-3 text-right">Unit Price</th>
                    <th class="py-2 px-3 text-center">Return Qty</th>
                    <th class="py-2 px-3 text-center">Eligible Restock?</th>
                  </tr>
                </thead>
                <tbody>${itemRows}</tbody>
              </table>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Return Reason</label>
              <input type="text" id="return-reason-input" required placeholder="e.g., Unopened surplus box, wrong size ordered..."
                class="w-full px-3 py-2 text-sm rounded-xl border border-slate-200 focus:outline-none focus:border-medteal-600" />
            </div>

            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="AppRouter.closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-sm font-medium text-slate-600">Cancel</button>
              <button type="submit" class="px-5 py-2 rounded-xl bg-medteal-600 hover:bg-medteal-500 text-white text-sm font-semibold">Confirm Return</button>
            </div>
          </form>
        `);

        document.getElementById('process-return-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const qtyInputs = Array.from(document.querySelectorAll('.return-qty-input'));
          const lines = qtyInputs.map((inp) => {
            const pid = inp.dataset.productId;
            const restockCb = document.querySelector(`input[data-restock-for="${pid}"]`);
            return {
              productId: pid,
              name: inp.dataset.productName,
              returnQty: Number(inp.value) || 0,
              restock: restockCb ? restockCb.checked : false,
            };
          });
          const reason = document.getElementById('return-reason-input').value.trim();

          try {
            const ret = this.processReturn(sale.id, lines, reason);
            Utils.showToast(`Return ${ret.id} processed (${Utils.formatCurrency(ret.totalRefund)} refunded).`, 'success');
            AppRouter.closeModal();
            AppRouter.updateNavBadges();
            this.render();
          } catch (err) {
            Utils.showToast(err.message, 'error');
          }
        });
      }
    };

      bindCatalogEvents() {
        const searchInput = document.getElementById('pos-search-input');
        const barcodeInput = document.getElementById('pos-barcode-input');
        const clearBtn = document.getElementById('pos-clear-search');

        if (searchInput) {
          searchInput.addEventListener('input', (e) => {
            this.searchQuery = e.target.value;
            this.renderProductGrid();
          });
        }
        if (clearBtn) {
          clearBtn.addEventListener('click', () => {
            this.searchQuery = '';
            this.render();
          });
        }
        if (barcodeInput) {
          barcodeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              const code = barcodeInput.value.trim();
              if (!code) return;
              const match = StorageService.getProducts().find(
                (p) => p.barcode.toLowerCase() === code.toLowerCase() || p.sku.toLowerCase() === code.toLowerCase()
              );
              if (match) {
                const added = CartModule.addItem(match.id, 1);
                if (added) {
                  barcodeInput.classList.add('scan-success');
                  setTimeout(() => barcodeInput.classList.remove('scan-success'), 600);
                  Utils.showToast(`Scanned: ${match.name}`, 'success');
                }
              } else {
                Utils.playBeep(220, 0.18);
                Utils.showToast(`No product found for barcode "${code}"`, 'error');
              }
              barcodeInput.value = '';
            }
          });
        }

        document.querySelectorAll('.pos-cat-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            this.selectedCategory = btn.dataset.cat;
            this.render();
          });
        });
      },

      renderProductGrid() {
        const grid = document.getElementById('pos-product-grid');
        if (!grid) return;

        const q = this.searchQuery.trim().toLowerCase();
        const products = StorageService.getProducts().filter((p) => {
          const catMatch = this.selectedCategory === 'All' || p.category === this.selectedCategory;
          if (!catMatch) return false;
          if (!q) return true;
          return (
            p.name.toLowerCase().includes(q) ||
            p.sku.toLowerCase().includes(q) ||
            p.barcode.toLowerCase().includes(q)
          );
        });

        if (products.length === 0) {
          grid.innerHTML = `
            <div class="col-span-full bg-white rounded-2xl border border-slate-200 p-10 text-center">
              <i data-lucide="package-search" class="w-10 h-10 text-slate-300 mx-auto mb-2"></i>

              <p class="text-xs text-slate-400 mt-1">Try adjusting your search term or category filter.</p>
            </div>
          `;
          if (window.lucide) lucide.createIcons({ nodes: [grid] });
          return;
        }

        grid.innerHTML = products
          .map((p) => {
            const outOfStock = p.quantity <= 0;
            const lowStock = p.quantity > 0 && p.quantity <= p.minStock;
            const daysExp = Utils.daysUntil(p.expiryDate);
            const expiringSoon = daysExp <= 60;

            const stockBadge = outOfStock
              ? `<span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-red-50 text-red-600 border border-red-200">Out of Stock</span>`

              ? `<span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-amber-50 text-amber-700 border border-amber-200 tabular-nums">Low: ${p.quantity} ${Utils.escapeHTML(p.unit)}</span>`
              : `<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 tabular-nums">${p.quantity} ${Utils.escapeHTML(p.unit)}</span>`;

            return `
              <div class="bg-white rounded-2xl border ${outOfStock ? 'border-slate-200 opacity-70' : 'border-slate-200 hover:border-medblue-500 hover:shadow-elevated'} shadow-card p-3.5 flex flex-col justify-between transition-all group">
                <div>
                  <div class="flex items-start justify-between gap-2.5 mb-2.5">
                    <div class="w-12 h-12 rounded-xl bg-slate-50 border border-slate-100 p-1.5 shrink-0">
                      ${Utils.getMedicalThumbnailSVG(p.imageIcon)}

                    <div class="flex flex-col items-end gap-1">
                      ${stockBadge}
                      <span class="text-[10px] font-mono text-slate-400">${Utils.escapeHTML(p.sku)}</span>
                    </div>
                  </div>
                  <h3 class="font-bold text-sm text-navy-800 leading-snug line-clamp-2 group-hover:text-medblue-600 transition-colors">
                    ${Utils.escapeHTML(p.name)}
                  </h3>
                  <div class="flex items-center gap-2 mt-1.5 text-[11px] text-slate-500">
                    <span>${Utils.escapeHTML(p.category)}</span>
                    ${
                      p.expiryDate
                        ? `<span>•</span><span class="${expiringSoon ? 'text-amber-600 font-semibold' : ''}">Exp: ${p.expiryDate}</span>`
                        : ''
                    }
                  </div>
                </div>

                <div class="mt-3.5 pt-2.5 border-t border-slate-100 flex items-center justify-between gap-2">
                  <div>
                    <span class="text-[10px] uppercase text-slate-400 block leading-none">Price</span>
                    <span class="font-extrabold text-base text-navy-800 tabular-nums">${Utils.formatCurrency(p.sellingPrice)}</span>

                    onclick="CartModule.addItem('${p.id}', 1)"

                      outOfStock
                        ? 'bg-slate-100 text-slate-400 cursor-not-allowed'

                    }">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                    <span>Add</span>
                  </button>
                </div>
              </div>
            `;
          })
          .join('');

        if (window.lucide) lucide.createIcons({ nodes: [grid] });

          paidInput.addEventListener('change', (e) => {
            CartModule.paidManuallyEdited = true;

            this.renderCart();
          });

        const exactBtn = document.getElementById('pos-exact-paid-btn');
        if (exactBtn) {
          exactBtn.addEventListener('click', () => {
            CartModule.paidManuallyEdited = false;
            this.renderCart();

        const completeBtn = document.getElementById('pos-complete-sale-btn');
        if (completeBtn) {
          completeBtn.addEventListener('click', () => CheckoutModule.completeSale());

        document.getElementById('product-crud-form').addEventListener('submit', (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const payload = {
            name: fd.get('name').trim(),
            sku: fd.get('sku').trim(),
            barcode: fd.get('barcode').trim(),
            category: fd.get('category').trim(),
            unit: fd.get('unit'),
            purchasePrice: Number(fd.get('purchasePrice')),
            sellingPrice: Number(fd.get('sellingPrice')),
            quantity: Number(fd.get('quantity')),
            minStock: Number(fd.get('minStock')),
            expiryDate: fd.get('expiryDate'),
            imageIcon: fd.get('imageIcon'),
            description: fd.get('description').trim(),
          };

          const check = ValidationService.validateProduct(payload, existing?.id || null);
          if (!check.valid) {
            Utils.showToast(check.errors[0], 'error');
            return;
          }

          const all = StorageService.getProducts();
          if (existing) {
            const idx = all.findIndex((p) => p.id === existing.id);
            const prevQty = all[idx].quantity;
            all[idx] = { ...all[idx], ...payload };
            StorageService.saveProducts(all);
            if (prevQty !== payload.quantity) {
              InventoryModule.recordMovement({
                productId: existing.id,
                productName: payload.name,
                sku: payload.sku,
                previousQty: prevQty,
                newQty: payload.quantity,
                type: 'ADJUSTMENT',
                reason: 'Edited via Product Catalog',
              });
            }
            Utils.showToast('Product updated successfully.', 'success');
          } else {
            const newProd = {
              id: Utils.generateId('PRD'),
              ...payload,
              batches:
                payload.quantity > 0
                  ? [{ batchNumber: `INIT-${Date.now().toString().slice(-4)}`, quantity: payload.quantity, expiryDate: payload.expiryDate }]
                  : [],
              createdAt: new Date().toISOString(),
            };
            all.unshift(newProd);
            StorageService.saveProducts(all);
            if (newProd.quantity > 0) {
              InventoryModule.recordMovement({
                productId: newProd.id,
                productName: newProd.name,
                sku: newProd.sku,
                previousQty: 0,
                newQty: newProd.quantity,
                type: 'STOCK_IN',
                reason: 'Initial Product Creation',
              });
            }
            Utils.showToast('Product added to catalog.', 'success');
          }

          AppRouter.closeModal();
          AppRouter.updateNavBadges();
          this.render();
        });
      },

        const products = StorageService.getProducts();
        const target = products.find((p) => p.id === productId);
        if (!target) return;

        AppRouter.openModal(`

            <h3 class="text-lg font-bold text-navy-800">Delete Product?</h3>
            <p class="text-sm text-slate-600">Are you sure you want to remove <strong>${Utils.escapeHTML(target.name)}</strong> (${Utils.escapeHTML(target.sku)})? Historical sales snapshots will remain intact.</p>

            </div>
          </div>
        `);

        document.getElementById('confirm-del-prod').addEventListener('click', () => {
          StorageService.saveProducts(products.filter((p) => p.id !== productId));
          Utils.showToast('Product deleted.', 'info');
          AppRouter.closeModal();
          AppRouter.updateNavBadges();
          this.render();
        });
      }
    };

    /**
     * =========================================================================
     * 9. DASHBOARD & ANALYTICS REPORTS MODULE (ReportsModule)
     * =========================================================================
     */
    const ReportsModule = {
      charts: {},

      destroyCharts() {
        Object.values(this.charts).forEach((ch) => {
          if (ch && typeof ch.destroy === 'function') ch.destroy();
        });
        this.charts = {};
      },

      render() {
        this.destroyCharts();
        const root = document.getElementById('app-root');
        const products = StorageService.getProducts();
        const customers = StorageService.getCustomers();
        const sales = StorageService.getSales().filter((s) => s.status !== 'Cancelled');
        const returns = StorageService.getReturns();

        const todayStr = Utils.todayISO();
        const totalRefunded = returns.reduce((sum, r) => sum + (Number(r.totalRefund) || 0), 0);

        const todaysSales = sales
          .filter((s) => s.createdAt.startsWith(todayStr))
          .reduce((sum, s) => sum + s.grandTotal, 0);

        const totalRevenue = Math.max(
          0,
          sales.reduce((sum, s) => sum + s.grandTotal, 0) - totalRefunded
        );

        let totalCOGS = 0;
        sales.forEach((s) => {
          s.items.forEach((i) => {
            totalCOGS += (Number(i.purchasePrice) || 0) * i.quantity;
          });
        });
        const estimatedGrossProfit = Math.max(0, totalRevenue - totalCOGS);

        const lowStockCount = products.filter((p) => p.quantity > 0 && p.quantity <= p.minStock).length;
        const outOfStockCount = products.filter((p) => p.quantity <= 0).length;

        root.innerHTML = `
          <div class="space-y-5">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
              <div>
                <h1 class="text-2xl font-bold text-navy-800">Executive Dashboard &amp; Analytics</h1>

        `;
      },

      initCharts(sales) {
        if (!window.Chart) return;

        // 1. Daily Sales (Last 7 Days)
        const last7Labels = [];
        const last7Totals = [];
        for (let i = 6; i >= 0; i--) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const iso = d.toISOString().split('T')[0];
          last7Labels.push(d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
          const daySum = sales
            .filter((s) => s.createdAt.startsWith(iso))
            .reduce((sum, s) => sum + s.grandTotal, 0);
          last7Totals.push(daySum);
        }

        this.charts.daily = new Chart(document.getElementById('chart-daily-sales'), {
          type: 'bar',
          data: {
            labels: last7Labels,
            datasets: [{ label: 'Revenue', data: last7Totals, backgroundColor: '#1D63B8', borderRadius: 8 }],
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } },
        });

        // 2. Monthly Sales
        const monthMap = {};
        sales.forEach((s) => {
          const key = s.createdAt.slice(0, 7);
          monthMap[key] = (monthMap[key] || 0) + s.grandTotal;
        });
        const monthKeys = Object.keys(monthMap).sort();
        this.charts.monthly = new Chart(document.getElementById('chart-monthly-sales'), {
          type: 'line',
          data: {
            labels: monthKeys.length ? monthKeys : [new Date().toISOString().slice(0, 7)],
            datasets: [
              {
                label: 'Monthly Sales',
                data: monthKeys.length ? monthKeys.map((k) => monthMap[k]) : [0],
                borderColor: '#0D9488',
                backgroundColor: 'rgba(13, 148, 136, 0.14)',
                fill: true,
                tension: 0.35,
              },
            ],
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } },
        });

        // 3. Top Selling Products
        const prodTotals = {};
        sales.forEach((s) => {
          s.items.forEach((i) => {
            prodTotals[i.name] = (prodTotals[i.name] || 0) + i.quantity;
          });
        });
        const topEntries = Object.entries(prodTotals)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 5);

        this.charts.topProducts = new Chart(document.getElementById('chart-top-products'), {
          type: 'bar',
          data: {
            labels: topEntries.map((e) => (e[0].length > 22 ? e[0].slice(0, 22) + '…' : e[0])),
            datasets: [{ label: 'Units Sold', data: topEntries.map((e) => e[1]), backgroundColor: '#0F2942', borderRadius: 6 }],
          },
          options: {
            indexAxis: 'y',
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
          },
        });

        // 4. Payment Method Distribution
        const payMap = { Cash: 0, Instapay: 0, 'Mobile Wallet': 0, 'Bank Transfer': 0 };
        sales.forEach((s) => {
          payMap[s.paymentMethod] = (payMap[s.paymentMethod] || 0) + s.grandTotal;
        });
        this.charts.payments = new Chart(document.getElementById('chart-payment-methods'), {
          type: 'doughnut',
          data: {
            labels: Object.keys(payMap),
            datasets: [
              {
                data: Object.values(payMap),
                backgroundColor: ['#0F2942', '#1D63B8', '#0D9488', '#64748B'],
                borderWidth: 0,
              },
            ],
          },
          options: { responsive: true, maintainAspectRatio: false, cutout: '64%' },
        });
      }

          const rows = StorageService.getSales().map((s) => ({
            SaleID: s.id, Date: s.createdAt, Customer: s.customerName, Subtotal: s.subtotal,
            Discount: s.discount, Shipping: s.shipping, GrandTotal: s.grandTotal, PaymentMethod: s.paymentMethod, Paid: s.paidAmount, Balance: s.remainingBalance, Status: s.status
          }));
          this.downloadCSV(rows, `medcore-sales-${Utils.todayISO()}.csv`);
        });

        document.getElementById('btn-export-inventory-csv').addEventListener('click', () => {
          const rows = StorageService.getInventoryMovements().map((m) => ({
            MovementID: m.id, Date: m.date, Product: m.productName, SKU: m.sku, Type: m.type, Batch: m.batchNumber, PrevQty: m.previousQty, NewQty: m.newQty, Reason: m.reason
          }));
          this.downloadCSV(rows, `medcore-inventory-${Utils.todayISO()}.csv`);
        });

        document.getElementById('btn-reset-demo').addEventListener('click', () => {
          AppRouter.openModal(`
            <div class="p-6 space-y-4">
              <h3 class="text-lg font-bold text-navy-800">Reset All Data to Factory Demo?</h3>
              <p class="text-sm text-slate-600">This will overwrite current local records with the initial 10 medical supplies, sample customers, and seed sales.</p>
              <div class="flex justify-end gap-2">
                <button onclick="AppRouter.closeModal()" class="px-4 py-2 rounded-xl border border-slate-200 text-sm">Cancel</button>
                <button id="confirm-reset-demo-btn" class="px-4 py-2 rounded-xl bg-red-600 text-white text-sm font-semibold">Yes, Reset Demo Data</button>
              </div>
            </div>
          `);
          document.getElementById('confirm-reset-demo-btn').addEventListener('click', () => {
            StorageService.initSeedData(true);
            CartModule.clear();
            AppRouter.closeModal();
            AppRouter.updateNavBadges();
            Utils.showToast('Demo data restored.', 'success');
            this.render();
          });
        });
      },

      downloadFile(content, filename, mimeType) {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      },

      downloadCSV(rows, filename) {
        if (!rows || rows.length === 0) {
          Utils.showToast('No records available to export.', 'warning');
          return;
        }
        const headers = Object.keys(rows[0]);
        const csvLines = [
          headers.join(','),
          ...rows.map((row) =>
            headers.map((h) => `"${String(row[h] ?? '').replace(/"/g, '""')}"`).join(',')
          ),
        ];
        this.downloadFile(csvLines.join('\n'), filename, 'text/csv;charset=utf-8;');
      }
    };

    /**
     * =========================================================================
     * 12. APPLICATION ROUTER & SHELL CONTROLLER (AppRouter)
     * =========================================================================
     */
    const AppRouter = {
      currentRoute: 'pos',

      init() {
        StorageService.initSeedData(false);
        CartModule.init();

        const settings = StorageService.getSettings();
        const brandEl = document.getElementById('nav-brand-name');
        if (brandEl) brandEl.textContent = settings.brandName;

        // Navigation clicks
        document.querySelectorAll('.nav-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            this.navigate(btn.dataset.route);
          });
        });

        // Modal backdrop click to close
        const modalRoot = document.getElementById('modal-root');
        modalRoot.addEventListener('click', (e) => {
          if (e.target === modalRoot) this.closeModal();
        });

        // Global POS Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            this.closeModal();
            return;
          }
          // Avoid hijacking inputs when typing normally unless F-keys
          const tag = document.activeElement?.tagName;
          const isTyping = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';

          if (e.key === 'F2' || (e.key === '/' && !isTyping)) {
            e.preventDefault();
            if (this.currentRoute !== 'pos') this.navigate('pos');
            setTimeout(() => document.getElementById('pos-search-input')?.focus(), 50);
          } else if (e.key === 'F4') {
            e.preventDefault();
            if (this.currentRoute !== 'pos') this.navigate('pos');
            setTimeout(() => document.getElementById('pos-barcode-input')?.focus(), 50);
          } else if (e.key === 'F8') {
            e.preventDefault();
            if (this.currentRoute !== 'pos') this.navigate('pos');
            setTimeout(() => {
              const paid = document.getElementById('pos-paid-input');
              if (paid) {
                paid.focus();
                paid.select();
              }
            }, 50);
          }
        });

        // Live Header Clock
        const updateClock = () => {
          const el = document.getElementById('live-clock');
          if (el) {
            el.textContent = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          }
        };
        updateClock();
        setInterval(updateClock, 1000);

        this.updateNavBadges();
        this.navigate('pos');
      },

      navigate(route) {
        this.currentRoute = route;
        document.querySelectorAll('.nav-btn').forEach((btn) => {
          const active = btn.dataset.route === route;
          btn.classList.toggle('bg-medblue-600', active);
          btn.classList.toggle('text-white', active);
          btn.classList.toggle('shadow-sm', active);
          btn.classList.toggle('text-slate-300', !active);
          btn.classList.toggle('hover:bg-navy-700', !active);
          btn.classList.toggle('hover:text-white', !active);
        });

        const routes = {
          pos: () => POSModule.render(),
          products: () => ProductsModule.render(),
          inventory: () => InventoryModule.render(),
          customers: () => CustomersModule.render(),
          sales: () => SalesModule.render(),
          reports: () => ReportsModule.render(),
          settings: () => SettingsModule.render(),
        };

        (routes[route] || routes.pos)();
      },

      updateNavBadges() {
        const products = StorageService.getProducts();
        const alertCount = products.filter((p) => p.quantity <= p.minStock).length;
        const badge = document.getElementById('nav-low-stock-badge');
        if (badge) {
          if (alertCount > 0) {
            badge.textContent = alertCount;
            badge.classList.remove('hidden');
          } else {
            badge.classList.add('hidden');
          }
        }
      },

      openModal(innerHTML) {
        const root = document.getElementById('modal-root');
        const content = document.getElementById('modal-content');
        content.innerHTML = innerHTML;
        root.classList.remove('hidden');
        root.classList.add('flex');
        if (window.lucide) lucide.createIcons({ nodes: [content] });
      },

      closeModal() {
        const root = document.getElementById('modal-root');
        root.classList.add('hidden');
        root.classList.remove('flex');
      }
    };

    // Bootstrap Application on DOM Ready
    window.addEventListener('DOMContentLoaded', () => AppRouter.init());
  </script>
</body>
